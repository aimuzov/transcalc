# Сайт на сервере проектов. Порты 80/443 занимает общий Caddy
# из aimuzov/infra-server, он проксирует сюда домен через сеть `edge`,

name: transcalc

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: transcalc
    container_name: transcalc
    mem_limit: 64m
    memswap_limit: 64m
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

# Переменные сборки лежат в `/srv/transcalc/.env`, образец -- `.env.example`.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
